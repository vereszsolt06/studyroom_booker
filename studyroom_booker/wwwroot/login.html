<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Belépés – Study Room Booker</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
    <div class="card login-card">
        <div class="card-body p-4">
            <h1 class="h4 text-center mb-4">
                <i class="bi bi-book"></i> Study Room Booker
            </h1>

            <ul class="nav nav-tabs mb-3" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="loginTab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button" role="tab">Belépés</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="registerTab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button" role="tab">Regisztráció</button>
                </li>
            </ul>

            <div id="errorAlert" class="alert alert-danger d-none"></div>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginNeptun" class="form-label">Neptun-kód</label>
                            <input type="text" id="loginNeptun" class="form-control text-uppercase" maxlength="6" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Jelszó</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Belépés</button>
                    </form>
                </div>

                <div class="tab-pane fade" id="registerPane" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="registerNeptun" class="form-label">Neptun-kód</label>
                            <input type="text" id="registerNeptun" class="form-control text-uppercase" maxlength="6" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerName" class="form-label">Teljes név</label>
                            <input type="text" id="registerName" class="form-control" maxlength="60" required>
                        </div>
                        <div class="mb-3">
                            <label for="registerPassword" class="form-label">Jelszó</label>
                            <input type="password" id="registerPassword" class="form-control" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Regisztráció</button>
                    </form>
                </div>
            </div>

            <hr>
            <p class="small text-muted mb-2">Demo fiókok:</p>
            <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-outline-secondary btn-sm demo-account" data-neptun="ADMIN1" data-password="admin123">ADMIN1</button>
                <button type="button" class="btn btn-outline-secondary btn-sm demo-account" data-neptun="ABC123" data-password="jelszo123">ABC123</button>
                <button type="button" class="btn btn-outline-secondary btn-sm demo-account" data-neptun="DEF456" data-password="jelszo123">DEF456</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
