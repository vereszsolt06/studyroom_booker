<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foglalás – Study Room Booker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book"></i> Study Room Booker</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Foglalás</a></li>
                <li class="nav-item"><a class="nav-link" href="stats.html">Statisztika</a></li>
            </ul>
            <div id="userMenu" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <main class="container mb-5">
        <div id="messageArea"></div>

        <div class="card mb-4">
            <div class="card-body d-flex flex-wrap align-items-center gap-2">
                <button id="prevDay" class="btn btn-outline-secondary" title="Előző nap"><i class="bi bi-chevron-left"></i></button>
                <input type="date" id="dateInput" class="form-control w-auto">
                <button id="nextDay" class="btn btn-outline-secondary" title="Következő nap"><i class="bi bi-chevron-right"></i></button>
                <button id="todayButton" class="btn btn-outline-primary">Ma</button>
                <h2 id="dateTitle" class="h5 mb-0 ms-md-3"></h2>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <div class="schedule-wrapper">
                    <table id="schedule" class="schedule"></table>
                </div>
                <div class="legend mt-3 small text-muted">
                    <span><span class="legend-box legend-free"></span>Szabad</span>
                    <span><span class="legend-box legend-mine"></span>Saját foglalás</span>
                    <span><span class="legend-box legend-other"></span>Más foglalása</span>
                    <span><span class="legend-box legend-past"></span>Elmúlt</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h2 id="upcomingTitle" class="h5 mb-3">Közelgő foglalásaim</h2>
                <div id="upcomingList" class="list-group list-group-flush"></div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="bookingForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="bookingModalTitle">Új foglalás</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="bookingError" class="alert alert-danger d-none"></div>

                        <div id="ownerSelectGroup" class="mb-3 d-none">
                            <label for="bookingOwner" class="form-label">Foglaló</label>
                            <select id="bookingOwner" class="form-select"></select>
                        </div>
                        <p id="ownerText" class="mb-3 text-muted d-none"></p>

                        <div class="mb-3">
                            <label for="bookingRoom" class="form-label">Terem</label>
                            <select id="bookingRoom" class="form-select" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="bookingDate" class="form-label">Dátum</label>
                            <input type="date" id="bookingDate" class="form-control" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label for="bookingStart" class="form-label">Kezdés</label>
                                <select id="bookingStart" class="form-select" required></select>
                            </div>
                            <div class="col">
                                <label for="bookingEnd" class="form-label">Befejezés</label>
                                <select id="bookingEnd" class="form-select" required></select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="bookingPeople" class="form-label">Létszám</label>
                            <input type="number" id="bookingPeople" class="form-control" min="1" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label for="bookingNote" class="form-label">Megjegyzés (nem kötelező)</label>
                            <input type="text" id="bookingNote" class="form-control" maxlength="200">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="deleteBookingButton" class="btn btn-outline-danger me-auto d-none">
                            <i class="bi bi-trash"></i> Törlés
                        </button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Mégse</button>
                        <button type="submit" class="btn btn-primary">Mentés</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
