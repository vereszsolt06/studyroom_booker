<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Statisztika – Study Room Booker</title>
    <link rel="icon" href="data:,">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="bi bi-book"></i> Study Room Booker</a>
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Foglalás</a></li>
                <li class="nav-item"><a class="nav-link active" href="stats.html">Statisztika</a></li>
            </ul>
            <div id="userMenu" class="d-flex align-items-center"></div>
        </div>
    </nav>

    <main class="container mb-5">
        <div id="messageArea"></div>

        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-4">
            <div>
                <h1 class="h3 mb-1">Statisztika</h1>
                <div id="periodText" class="text-muted"></div>
            </div>
            <div id="rangeButtons" class="btn-group">
                <button type="button" class="btn btn-outline-primary" data-days="7">Elmúlt 7 nap</button>
                <button type="button" class="btn btn-outline-primary active" data-days="30">Elmúlt 30 nap</button>
                <button type="button" class="btn btn-outline-primary" data-days="all">Összes</button>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-6 col-lg-3">
                <div class="card h-100"><div class="card-body">
                    <div class="kpi-label">Foglalások</div>
                    <div id="kpiBookings" class="kpi-value">–</div>
                </div></div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card h-100"><div class="card-body">
                    <div class="kpi-label">Foglalt órák</div>
                    <div id="kpiHours" class="kpi-value">–</div>
                    <div id="kpiHoursSub" class="small text-muted"></div>
                </div></div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card h-100"><div class="card-body">
                    <div class="kpi-label">Legnépszerűbb terem</div>
                    <div id="kpiRoom" class="kpi-value">–</div>
                </div></div>
            </div>
            <div class="col-6 col-lg-3">
                <div class="card h-100"><div class="card-body">
                    <div class="kpi-label">Csúcsidő</div>
                    <div id="kpiPeak" class="kpi-value">–</div>
                    <div id="kpiPeakSub" class="small text-muted"></div>
                </div></div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-lg-6">
                <div class="card h-100"><div class="card-body">
                    <h2 class="h5 mb-3">Termek kihasználtsága (%)</h2>
                    <div class="chart-box"><canvas id="roomsChart"></canvas></div>
                </div></div>
            </div>
            <div class="col-lg-6">
                <div class="card h-100"><div class="card-body">
                    <h2 class="h5 mb-3">Foglalt termek óránként</h2>
                    <div class="chart-box"><canvas id="hourlyChart"></canvas></div>
                </div></div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-body">
                <h2 class="h5 mb-3">Hőtérkép (nap × óra)</h2>
                <div class="table-responsive">
                    <table id="heatmap" class="heatmap"></table>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h2 class="h5 mb-3">Top 5 diák</h2>
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Név</th>
                            <th class="text-end">Foglalások</th>
                            <th class="text-end">Órák</th>
                        </tr>
                    </thead>
                    <tbody id="topStudents"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/stats.js"></script>
</body>
</html>
